<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CoopSaaS — Online Cooperative Society Database & Tax Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   CSS — applied after the HTML structure below
   ============================================================ */
:root{
  --brand-50:#eef2ff;--brand-100:#e0e7ff;--brand-200:#c7d2fe;--brand-300:#a5b4fc;
  --brand-500:#6366f1;--brand-600:#4f46e5;--brand-700:#4338ca;--brand-800:#3730a3;--brand-900:#312e81;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;
  --gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter','Poppins',system-ui,sans-serif;color:var(--gray-800);background:#fff;line-height:1.55;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Poppins','Inter',sans-serif;line-height:1.25}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
.logo{font-family:'Poppins',sans-serif;font-weight:700;font-size:1.25rem;color:var(--brand-700)}
.logo span{color:var(--gray-900)}
.container{max-width:1140px;margin:0 auto;padding:0 22px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.9rem;border-radius:10px;padding:10px 18px;border:none;transition:all .2s}
.btn-primary{background:var(--brand-600);color:#fff}.btn-primary:hover{background:var(--brand-700)}
.btn-outline{background:#fff;color:var(--gray-700);border:1px solid var(--gray-300)}.btn-outline:hover{border-color:var(--brand-500);color:var(--brand-600)}
.btn-tiny{padding:4px 9px;font-size:12px;border-radius:8px;border:1px solid var(--gray-200);background:var(--gray-50);color:var(--gray-600)}
.btn-tiny.danger{color:#dc2626}.btn-tiny:hover{background:var(--gray-100)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.w-full{width:100%}
.btn-link{background:none;border:none;color:var(--brand-600);font-weight:600;font-size:.9rem}
.btn-link.danger{color:#fca5a5}
.w-full{width:100%}

/* ---------- landing ---------- */
.l-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--gray-200)}
.l-nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.l-links{display:flex;align-items:center;gap:22px}
.l-links a{font-size:.9rem;font-weight:500;color:var(--gray-600)}.l-links a:hover{color:var(--brand-600)}
.hero{background:linear-gradient(135deg,var(--brand-50),#fff 55%,var(--brand-50));padding:74px 0;text-align:center}
.hero-badge{display:inline-block;background:#fff;border:1px solid var(--brand-200);color:var(--brand-700);font-size:.78rem;font-weight:600;border-radius:999px;padding:6px 14px;margin-bottom:16px}
.hero h1{font-size:2.5rem;font-weight:800;letter-spacing:-.02em;color:var(--gray-900)}
.hero h1 .accent{color:var(--brand-600)}
.hero .lead{margin:16px auto 0;max-width:560px;font-size:1.05rem;color:var(--gray-500)}
.hero-ctas{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
section{padding:64px 0}
.sec-title{text-align:center;font-size:1.9rem;font-weight:700;margin-bottom:36px}
.f-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.f-card{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:22px;transition:.25s}
.f-card:hover{transform:translateY(-3px);border-color:var(--brand-200);box-shadow:0 14px 30px -14px rgba(49,46,129,.18)}
.f-icon{font-size:1.6rem;margin-bottom:10px}
.f-card h3{font-size:1.02rem;margin-bottom:6px}
.f-card p{font-size:.88rem;color:var(--gray-500)}
.p-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch}
.p-card{position:relative;background:#fff;border:1px solid var(--gray-200);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:8px}
.p-card.featured{border:2px solid var(--brand-600);box-shadow:0 18px 40px -16px rgba(79,70,229,.3)}
.p-card .tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--brand-600);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 13px;border-radius:999px}
.p-card .price{font-size:1.9rem;font-weight:800}
.p-card .price small{font-size:.85rem;font-weight:500;color:var(--gray-400)}
.p-card .sub{font-size:.85rem;color:var(--gray-500)}
.p-card .btn{margin-top:14px}
.p-card.current{border-color:var(--brand-500);background:var(--brand-50)}
.fine{font-size:.78rem;color:var(--gray-400);margin-top:10px}
.l-footer{background:var(--gray-900);color:var(--gray-400);padding:30px 0;font-size:.82rem;margin-top:30px}

/* ---------- auth ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--brand-50),#fff 60%,var(--brand-50));padding:18px}
.auth-card{background:#fff;border:1px solid var(--gray-200);border-radius:18px;box-shadow:0 24px 60px -20px rgba(49,46,129,.25);padding:30px;width:100%;max-width:430px}
.auth-card h1{font-size:1.5rem;margin-top:14px}
.auth-card .form{margin-top:18px}
.demo-box{margin-top:18px;background:var(--gray-50);border:1px dashed var(--gray-300);border-radius:12px;padding:14px}
.demo-box .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.muted{color:var(--gray-500)}.small{font-size:.82rem}.center{text-align:center;margin-top:14px}
.muted a{color:var(--brand-600);font-weight:600}

/* ---------- app shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--brand-900);color:#fff;display:flex;flex-direction:column;z-index:40;transition:transform .25s}
.sidebar .brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar .brand .logo{color:#fff;font-size:1.1rem}
.sidebar .brand .logo span{color:var(--brand-300)}
.sidebar nav{flex:1;padding:12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nav-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:.88rem;font-weight:500;color:var(--brand-100);transition:.2s}
.nav-link:hover{background:var(--brand-800);color:#fff}
.nav-link.active{background:var(--brand-600);color:#fff}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:8px}
.side-foot .who{font-size:.8rem;color:var(--brand-200);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{margin-left:236px;flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--gray-200);padding:14px 22px;display:flex;align-items:center;gap:14px}
.topbar h2{font-size:1.15rem}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.bell{position:relative;font-size:1.1rem}
.bell .count{position:absolute;top:-7px;right:-9px;background:#dc2626;color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px}
.who{font-size:.85rem;font-weight:600;color:var(--gray-600)}
.burger{display:none;background:none;border:none;font-size:20px;color:var(--gray-700);padding:2px 6px}
.content{padding:22px;flex:1}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .main{margin-left:0}
  .burger{display:inline-flex}
  .f-grid,.p-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .f-grid,.p-grid{grid-template-columns:1fr}
  .hero h1{font-size:1.8rem}
  .l-links .btn-outline{display:none}
  .content{padding:14px}
  .topbar{padding:12px 14px}
}

/* ---------- cards / stats ---------- */
.cards{display:grid;gap:14px;margin-bottom:18px}
.grid2{grid-template-columns:repeat(2,1fr)}
.grid3{grid-template-columns:repeat(3,1fr)}
.grid4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.stat-card{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:16px 18px}
.stat-label{display:block;font-size:12px;font-weight:600;color:var(--gray-500)}
.stat-value{display:block;font-size:21px;font-weight:800;color:var(--gray-900);margin-top:4px;word-break:break-word}
.stat-sub{display:block;font-size:11px;color:var(--gray-400);margin-top:2px}
.card{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:20px;margin-bottom:16px}
.card h3{font-size:1rem;margin-bottom:12px}
.mini-stat{background:var(--gray-50);border:1px solid var(--gray-100);border-radius:10px;padding:10px;text-align:center}
.mini-stat b{display:block;font-size:15px}
.mini-stat span{font-size:11px;color:var(--gray-500)}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--gray-200);border-radius:12px;background:#fff}
.table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px}
.table th{text-align:left;padding:10px 13px;background:var(--gray-50);color:var(--gray-500);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.table td{padding:10px 13px;border-top:1px solid var(--gray-100);vertical-align:top}
.table tbody tr:hover td{background:#fafaff}
.row-actions{display:flex;gap:5px;flex-wrap:wrap}
.empty{color:var(--gray-400);text-align:center;padding:30px;font-size:.9rem}

/* ---------- badges ---------- */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge.green{background:#ecfdf5;color:#047857}
.badge.amber{background:#fffbeb;color:#b45309}
.badge.red{background:#fef2f2;color:#b91c1c}
.badge.blue{background:#eff6ff;color:#1d4ed8}
.badge.gray{background:var(--gray-100);color:var(--gray-600)}

/* ---------- forms ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.input{width:100%;padding:9px 12px;border:1px solid var(--gray-300);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:var(--gray-800)}
.input:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-100)}
.toolbar .input{width:auto;min-width:150px}
.form label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin:0 0 4px}
.form .input{margin-bottom:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.form.inline{display:flex;gap:10px;flex-wrap:wrap}
.form.inline .input{width:auto}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 30px 70px -20px rgba(0,0,0,.35)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h3{font-size:1.1rem}
.modal-x{background:none;border:none;font-size:24px;color:var(--gray-400);line-height:1}
.modal h4{margin:14px 0 8px;font-size:.95rem}

/* ---------- toast ---------- */
#toast-root{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:12px;color:#fff;font-size:14px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.2);animation:slideIn .25s ease;max-width:340px}
.toast.success{background:#059669}.toast.error{background:#dc2626}.toast.info{background:var(--brand-600)}
@keyframes slideIn{from{transform:translateY(12px);opacity:0}}

/* ---------- notifications ---------- */
.notif{border:1px solid var(--gray-200);border-radius:12px;padding:11px 14px;margin-bottom:8px;background:#fff;cursor:pointer}
.notif.read{opacity:.62}
.notif p{font-size:.85rem;color:var(--gray-600);margin-top:2px}

/* ---------- charts ---------- */
.chart{display:flex;gap:8px;height:210px;align-items:flex-end}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.chart-single,.chart-bars2{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.chart-bar{width:20px;border-radius:6px 6px 0 0;min-height:2px}
.chart-col>span{font-size:11px;color:var(--gray-400)}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--gray-500);margin-top:8px}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- print ---------- */
@media print{
  .no-print,.sidebar,.topbar,.toolbar{display:none!important}
  .main{margin:0!important}
  body{background:#fff}
  .card{border:none;padding:0}
}
</style>
</head>

<!-- ============ HTML STRUCTURE (rendered by JS into #app) ============ -->
<main id="app"></main>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
'use strict';
/* ============================================================
   JAVASCRIPT — the logic layer, added after the HTML structure
   ============================================================ */
const DB_KEY='coop_mvp_v1';
const SESSION_KEY='coop_mvp_sess_v1';
const DAY=86400000;
const dSince=(n)=>new Date(Date.now-n*DAY).toISOString;
const dPlus=(n)=>new Date(Date.now+n*DAY).toISOString;
const uid==>'id'+Math.random.toString(36).slice(2,9)+Date.now.toString(36);

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n){return '₦'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(iso){if(!iso)return '—';return new Date(iso).toLocaleDateString;}
function memberName(id){const m=db.members.find(x=>x.id===id);return m?m.fullName:'—';}
function currentUser{const id=localStorage.getItem(SESSION_KEY);return db.users.find(u=>u.id===id)||null;}
function currentCoop{const u=currentUser;return u&&u.coopId?db.coops.find(c=>c.id===u.coopId):null;}
function render(html){document.getElementById('app').innerHTML=html;document.getElementById('modal-root').innerHTML='';window.scrollTo(0,0);}
function toast(msg,type){type=type||'success';const r=document.getElementById('toast-root');const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;r.appendChild(el);setTimeout(=>el.remove,3800);}
function openModal(html){document.getElementById('modal-root').innerHTML='<div class="modal-backdrop"><div class="modal">'+html+'</div></div>';}
function closeModal{document.getElementById('modal-root').innerHTML='';}
function notif(coopId,userId,type,title,msg){db.notifications.push({id:uid,coopId:coopId,userId:userId||null,type:type,title:title,msg:msg,read:false,at:new Date.toISOString});}
function notifCount(coopId){const u=currentUser;return db.notifications.filter(n=>n.coopId===coopId&&(!n.userId||n.userId===u.id)&&!n.read).length;}
function badge(s,color){const map={ACTIVE:'green',INACTIVE:'gray',PENDING:'amber',APPROVED:'blue',REJECTED:'red',PAID:'green',OVERDUE:'red',FULLY_PAID:'green'};const c=color||map[s]||'gray';return '<span class="badge '+c+'">'+esc(String(s||'').replace(/_/g,' '))+'</span>';}
function statCard(label,value,sub){return '<div class="stat-card"><span class="stat-label">'+esc(label)+'</span><span class="stat-value">'+value+'</span>'+(sub?'<span class="stat-sub">'+esc(sub)+'</span>':'')+'</div>';}
function csvExport(rows,name){
  if(!rows.length){toast('Nothing to export','error');return;}
  const head=Object.keys(rows[0]);
  const csv=[head.join(','),...rows.map(r=>head.map(k=>'"'+String(r[k]==null?'':r[k]).replace(/"/g,'""')+'"').join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name+'.csv';a.click;
}

/* ---------- business logic ---------- */
function loanTotals(l){
  const principal=Number(l.amount);
  const interest=principal*Number(l.rate)/100;
  const total=principal+interest;
  const paid=db.repayments.filter(r=>r.loanId===l.id).reduce((s,r)=>s+Number(r.amount),0);
  return {principal:principal,interest:interest,total:total,paid:paid,outstanding:total-paid};
}
function coopStats(coopId){
  const sum=(arr,k)=>arr.reduce((s,x)=>s+Number(x[k]||0),0);
  const members=db.members.filter(m=>m.coopId===coopId);
  const totalContributions=sum(db.contributions.filter(c=>c.coopId===coopId),'amount');
  const totalLoans=sum(db.loans.filter(l=>l.coopId===coopId),'amount');
  const paidLoans=sum(db.repayments.filter(r=>r.coopId===coopId),'amount');
  const totalIncome=sum(db.incomes.filter(i=>i.coopId===coopId),'amount');
  const totalExpenses=sum(db.expenses.filter(e=>e.coopId===coopId),'amount');
  const taxLiability=sum(db.taxRecords.filter(t=>t.coopId===coopId),'liability');
  const taxPaid=sum(db.taxRecords.filter(t=>t.coopId===coopId),'paid');
  return {
    members:members.filter(m=>m.status==='ACTIVE').length,
    totalMembers:members.length,
    totalContributions:totalContributions,
    totalLoans:totalLoans,
    outstandingLoans:Math.max(0,totalLoans-paidLoans),
    totalIncome:totalIncome,
    totalExpenses:totalExpenses,
    net:totalIncome-totalExpenses,
    taxLiability:taxLiability,
    taxPaid:taxPaid,
    outstandingTax:Math.max(0,taxLiability-taxPaid)
  };
}
function monthlySeries(coopId){
  const out=;const now=new Date;
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear,now.getMonth-i,1);
    const from=d.toISOString;
    const toNext=new Date(d.getFullYear,d.getMonth+1,1).toISOString;
    const inR=(iso)=>iso>=from&&iso<toNext;
    out.push({
      label:d.toLocaleString('en-US',{month:'short'}),
      contributions:db.contributions.filter(c=>c.coopId===coopId&&inR(c.date)).reduce((s,c)=>s+Number(c.amount),0),
      income:db.incomes.filter(x=>x.coopId===coopId&&inR(x.date)).reduce((s,x)=>s+Number(x.amount),0),
      expenses:db.expenses.filter(x=>x.coopId===coopId&&inR(x.date)).reduce((s,x)=>s+Number(x.amount),0)
    });
  }
  return out;
}
function barChart(points,color){
  const max=Math.max(...points.map(p=>p.value),1);
  return '<div class="chart">'+points.map(p=>'<div class="chart-col"><div class="chart-single"><div class="chart-bar" style="height:'+Math.round(p.value/max*100)+'%;background:'+color+'"></div></div><span>'+p.label+'</span></div>').join('')+'</div>';
}
function barChartMulti(points,colors,names){
  const max=Math.max(...points.map(p=>p.values),1);
  return '<div class="chart">'+points.map(p=>'<div class="chart-col"><div class="chart-bars2">'+p.values.map((v,i)=>'<div class="chart-bar" style="height:'+Math.round(v/max*100)+'%;background:'+colors[i]+'"></div>').join('')+'</div><span>'+p.label+'</span></div>').join('')+'</div><div class="legend">'+names.map((n,i)=>'<span class="lg"><i style="background:'+colors[i]+'"></i>'+n+'</span>').join('')+'</div>';
}

  +'<button class="btn btn-outline small" data-action="print">🖨 Print</button>'
  +'</div><div id="report-body">'+reportBody+'</div>';

function reportRows(type,from,to){
  const coop=currentCoop;
  const inRange=(iso)=>{if(!from&&!to)return true;const t=new Date(iso).getTime;if(from&&t<new Date(from).getTime)return false;if(to&&t>new Date(to+'T23:59:59').getTime)return false;return true;};
  if(type==='members')return db.members.filter(m=>m.coopId===coop.id).map(m=>({MemberNo:m.memberNo,Name:m.fullName,Email:m.email||'',Phone:m.phone||'',Occupation:m.occupation||'',Status:m.status,Joined:fmtDate(m.joined)}));
  if(type==='contributions')return db.contributions.filter(c=>c.coopId===coop.id&&inRange(c.date)).map(c=>({Date:fmtDate(c.date),Member:memberName(c.memberId),Type:c.type.replace(/_/g,' '),Amount:Number(c.amount),Method:c.method,Reference:c.ref||''}));
  if(type==='loans')return db.loans.filter(l=>l.coopId===coop.id&&inRange(l.start)).map(l=>{const t=loanTotals(l);return {Member:memberName(l.memberId),Amount:Number(l.amount),Rate:l.rate+'%',TotalPayable:Number(t.total),Paid:Number(t.paid),Outstanding:Number(t.outstanding),Status:l.status,Due:fmtDate(l.due)};});
  if(type==='incomes')return db.incomes.filter(i=>i.coopId===coop.id&&inRange(i.date)).map(i=>({Date:fmtDate(i.date),Source:i.source,Category:i.category,Amount:Number(i.amount),Reference:i.ref||''}));
  if(type==='expenses')return db.expenses.filter(e=>e.coopId===coop.id&&inRange(e.date)).map(e=>({Date:fmtDate(e.date),Category:e.category,Amount:Number(e.amount),Payee:e.payee||'',Reference:e.ref||''}));
  if(type==='taxes')return db.taxRecords.filter(t=>t.coopId===coop.id).map(r=>{const rule=db.taxRules.find(x=>x.id===r.ruleId);return {Period:r.period,Rule:rule?rule.name:'',TaxableIncome:Number(r.taxableIncome),Liability:Number(r.liability),Paid:Number(r.paid),Outstanding:Number(Math.max(0,r.liability-r.paid)),Status:r.status};});
  return;
}
function reportBody{
  const from=(document.getElementById('r-from')||{}).value||'';
  const to=(document.getElementById('r-to')||{}).value||'';
  const rows=reportRows(ACTIVE_REPORT,from,to);
  if(!rows.length)return '<p class="empty">No records in the selected range.</p>';
  return '<div class="table-wrap"><table class="table"><thead><tr>'+Object.keys(rows[0]).map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr></thead><tbody>'
  +rows.map(r=>'<tr>'+Object.values(r).map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')
  +'</tbody></table></div>';
}
function renderReports{const el=document.getElementById('report-body');if(el)el.innerHTML=reportBody;}

    coop.planId=plan.id;coop.planName=plan.name;coop.memberLimit=plan.memberLimit;coop.status='ACTIVE';
    db.payments.push({id:uid,coopId:coop.id,planName:plan.name,amount:amount,date:new Date.toISOString,method:'MOCK',ref:'MOCK-'+Math.floor(Math.random*9000+1000),status:'SUCCESS'});

function setLoanStatus(el,status){
  const loan=db.loans.find(x=>x.id===el.dataset.id);
  if(!loan)return;
  loan.status=status;
  notif(loan.coopId,null,'LOAN','Loan '+status.replace(/_/g,' ').toLowerCase,'Loan of '+fmt(loan.amount)+' for '+memberName(loan.memberId)+' is now '+status.replace(/_/g,' ')+'.');
  saveDB;toast('Loan '+status.toLowerCase,'success');route;
}

/* ---------- form handlers ---------- */
const FORMS={
  login(f){
    const fd=Object.fromEntries(new FormData(f));
    const u=db.users.find(x=>x.email.toLowerCase===fd.email.toLowerCase.trim);
    if(!u||atob(u.pass)!==fd.password){toast('Invalid email or password','error');return;}
    if(u.status!=='ACTIVE'){toast('This account is suspended','error');return;}
    if(u.coopId){
      const c=db.coops.find(x=>x.id===u.coopId);
      if(c&&c.status==='SUSPENDED'){toast('Your cooperative has been suspended','error');return;}
    }
    localStorage.setItem(SESSION_KEY,u.id);
    toast('Welcome back, '+u.name,'success');
    goHome;
  },
  register(f){
    const fd=Object.fromEntries(new FormData(f));
    if(!fd.name||!fd.regNumber||!fd.adminName||!fd.adminEmail||fd.password.length<8){toast('Complete all required fields (password min 8 characters)','error');return;}
    if(db.coops.some(c=>c.regNumber.toLowerCase===fd.regNumber.toLowerCase.trim)){toast('A cooperative with this registration number already exists','error');return;}
    if(db.users.some(u=>u.email.toLowerCase===fd.adminEmail.toLowerCase.trim)){toast('Administrator email is already registered','error');return;}
    const plan=db.plans.find(p=>p.id===fd.planId)||db.plans[0];
    const coop={id:uid,name:fd.name,regNumber:fd.regNumber.trim,email:fd.email,phone:fd.phone,address:fd.address,state:fd.state,planId:plan.id,planName:plan.name,memberLimit:plan.memberLimit,status:'TRIAL',trialEnd:new Date(Date.now+14*DAY).toISOString,expiry:new Date(Date.now+14*DAY).toISOString};
    db.coops.push(coop);
    const admin={id:uid,name:fd.adminName,email:fd.adminEmail.toLowerCase.trim,pass:btoa(fd.password),role:'COOP_ADMIN',coopId:coop.id,memberId:null,status:'ACTIVE'};
    db.users.push(admin);
    notif(coop.id,admin.id,'SUBSCRIPTION','Welcome','Your '+plan.name+' trial is active for 14 days.');
    saveDB;
    localStorage.setItem(SESSION_KEY,admin.id);
    toast('Cooperative created — 14-day trial started!','success');
    location.hash='#/app';
  },
  member(f){
    const fd=Object.fromEntries(new FormData(f));
    if(!fd.fullName){toast('Full name is required','error');return;}
    const coop=currentCoop;
    if(fd.id){
      const m=db.members.find(x=>x.id===fd.id);
      if(!m)return;
      Object.assign(m,{fullName:fd.fullName,email:fd.email,phone:fd.phone,address:fd.address,occupation:fd.occupation,joined:fd.joined?new Date(fd.joined+'T12:00:00').toISOString:m.joined});
      saveDB;toast('Member updated','success');
    }else{
      if(coop.memberLimit!==-1&&db.members.filter(m=>m.coopId===coop.id).length>=coop.memberLimit){toast('Member limit reached for your plan','error');return;}
      const no='COOP-'+new Date.getFullYear+'-'+String(db.members.filter(m=>m.coopId===coop.id).length+1).padStart(4,'0');
      db.members.push({id:uid,coopId:coop.id,memberNo:no,fullName:fd.fullName,email:fd.email,phone:fd.phone,address:fd.address,occupation:fd.occupation,status:'ACTIVE',joined:fd.joined?new Date(fd.joined+'T12:00:00').toISOString:new Date.toISOString});
      notif(coop.id,null,'MEMBER','New member added',fd.fullName+' ('+no+') was registered.');
      saveDB;toast('Member added — '+no,'success');
    }
    closeModal;route;
  },
  contribution(f){
    const fd=Object.fromEntries(new FormData(f));
    if(!fd.memberId||!fd.amount||Number(fd.amount)<=0){toast('Member and positive amount required','error');return;}
    const coop=currentCoop;
    db.contributions.push({id:uid,coopId:coop.id,memberId:fd.memberId,type:fd.type,amount:Number(fd.amount),method:fd.method||'CASH',ref:fd.ref,date:fd.date?new Date(fd.date+'T12:00:00').toISOString:new Date.toISOString,desc:fd.desc,by:currentUser.id});
    notif(coop.id,null,'CONTRIBUTION','Contribution recorded',fmt(fd.amount)+' '+fd.type.replace(/_/g,' ')+' for '+memberName(fd.memberId)+'.');
    saveDB;toast('Contribution recorded','success');closeModal;route;
  },
  loan(f){
    const fd=Object.fromEntries(new FormData(f));
    if(!fd.memberId||!fd.amount||Number(fd.amount)<=0){toast('Member and positive amount required','error');return;}
    const coop=currentCoop;
    const start=fd.start?new Date(fd.start+'T12:00:00'):new Date;
    const due=new Date(start);due.setMonth(due.getMonth+Number(fd.months||12));
    db.loans.push({id:uid,coopId:coop.id,memberId:fd.memberId,amount:Number(fd.amount),rate:Number(fd.rate||0),months:Number(fd.months||12),start:start.toISOString,due:due.toISOString,freq:fd.freq||'MONTHLY',status:'PENDING',by:null});
    notif(coop.id,null,'LOAN','Loan application','Loan of '+fmt(fd.amount)+' applied for '+memberName(fd.memberId)+'.');
    saveDB;toast('Loan application submitted','success');closeModal;route;
  },
  repay(f){
    const fd=Object.fromEntries(new FormData(f));
    const l=db.loans.find(x=>x.id===fd.loanId);
    if(!l)return;
    const t=loanTotals(l);
    const amt=Number(fd.amount);
    if(!amt||amt<=0||amt>t.outstanding){toast('Enter a valid amount within the outstanding balance','error');return;}
    db.repayments.push({id:uid,coopId:l.coopId,loanId:l.id,memberId:l.memberId,amount:amt,date:fd.date?new Date(fd.date+'T12:00:00').toISOString:new Date.toISOString,ref:'REP-'+Math.floor(Math.random*9000+1000)});
    l.status=(t.paid+amt>=t.total)?'FULLY_PAID':'PARTIALLY_PAID';
    notif(l.coopId,null,'REPAYMENT','Loan repayment',fmt(amt)+' repaid on loan for '+memberName(l.memberId)+'.');
    saveDB;toast('Repayment recorded','success');closeModal;route;
  },
  income(f){
    const fd=Object.fromEntries(new FormData(f));
    if(!fd.source||!fd.amount||Number(fd.amount)<=0){toast('Source and positive amount required','error');return;}
    const coop=currentCoop;
    db.incomes.push({id:uid,coopId:coop.id,source:fd.source,category:fd.category,amount:Number(fd.amount),date:fd.date?new Date(fd.date+'T12:00:00').toISOString:new Date.toISOString,ref:fd.ref,desc:fd.desc});
    saveDB;toast('Income recorded','success');closeModal;route;
  },
  expense(f){
    const fd=Object.fromEntries(new FormData(f));
    if(!fd.category||!fd.amount||Number(fd.amount)<=0){toast('Category and positive amount required','error');return;}
    const coop=currentCoop;
    db.expenses.push({id:uid,coopId:coop.id,category:fd.category,amount:Number(fd.amount),date:fd.date?new Date(fd.date+'T12:00:00').toISOString:new Date.toISOString,payee:fd.payee,ref:fd.ref,desc:fd.desc});
    saveDB;toast('Expense recorded','success');closeModal;route;
  },
  taxrule(f){
    const fd=Object.fromEntries(new FormData(f));
    if(!fd.name||fd.rate===''){toast('Rule name and rate are required','error');return;}
    const coop=currentCoop;
    db.taxRules.push({id:uid,coopId:coop.id,name:fd.name,taxType:fd.taxType,rate:Number(fd.rate),threshold:fd.threshold?Number(fd.threshold):0,deduction:fd.deduction?Number(fd.deduction):0,active:fd.active==='true',eff:fd.eff?new Date(fd.eff+'T12:00:00').toISOString:new Date.toISOString});
    saveDB;toast('Tax rule saved','success');closeModal;route;
  },
  taxcompute(f){
    const fd=Object.fromEntries(new FormData(f));
    if(!fd.ruleId){toast('Select a tax rule','error');return;}
    const coop=currentCoop;
    const rule=db.taxRules.find(r=>r.id===fd.ruleId);
    if(!rule)return;
    const gross=db.incomes.filter(i=>i.coopId===coop.id).reduce((s,i)=>s+Number(i.amount),0);
    const taxable=Math.max(0,gross-Number(rule.deduction||0));
    const liability=Math.round(taxable*Number(rule.rate)/100*100)/100;
    const period=fd.period||String(new Date.getFullYear);
    let rec=db.taxRecords.find(r=>r.coopId===coop.id&&r.ruleId===rule.id&&r.period===period);
    if(rec){rec.taxableIncome=taxable;rec.rate=rule.rate;rec.liability=liability;rec.status='PENDING';}
    else{db.taxRecords.push({id:uid,coopId:coop.id,ruleId:rule.id,period:period,taxableIncome:taxable,rate:rule.rate,liability:liability,paid:0,status:'PENDING',due:dPlus(14)});}
    saveDB;toast('Computed tax liability: '+fmt(liability)+' ('+rule.name+'). Verify rates per applicable law.','info');route;
  },
  taxpay(f){
    const fd=Object.fromEntries(new FormData(f));
    const rec=db.taxRecords.find(r=>r.id===fd.recordId);
    if(!rec)return;
    const amt=Number(fd.amount);
    if(!amt||amt<=0){toast('Enter a positive amount','error');return;}
    rec.paid+=amt;
    if(rec.paid>=rec.liability)rec.status='PAID';
    saveDB;toast('Tax payment recorded','success');closeModal;route;
  }
};

/* ---------- router ---------- */
function route{
  const h=location.hash||'#/';
  const parts=h.replace('#/','').split('/');
  const sec=parts[0];
  const u=currentUser;
  if(sec==='app'&&!u){location.hash='#/login';return;}
  if(sec==='portal'&&(!u||u.role!=='MEMBER')){u?goHome:location.hash='#/login';return;}
  if(sec==='superadmin'&&(!u||u.role!=='SUPER_ADMIN')){u?goHome:location.hash='#/login';return;}
  let html;
  if(sec===''){html=landing;}
  else if(sec==='login'){html=loginView;}
  else if(sec==='register'){html=registerView;}
  else if(sec==='app'){html=appView(parts[1]||'dashboard');}
  else if(sec==='portal'){html=appView('portal');}
  else if(sec==='superadmin'){html=superView;}
  else{html=landing;}
  render(html);
}

/* ---------- global event delegation ---------- */
document.addEventListener('click',function(e){
  if(e.target.classList.contains('modal-backdrop')){closeModal;return;}
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const fn=ACTIONS[el.dataset.action];
  if(fn){e.preventDefault;fn(el,e);}
});
document.addEventListener('submit',function(e){
  const f=e.target.closest('form[data-form]');
  if(!f)return;
  e.preventDefault;
  const fn=FORMS[f.dataset.form];
  if(fn)fn(f,e);
});
document.addEventListener('change',function(e){
  const sel=e.target.closest('select[data-action]');
  if(!sel)return;
  const fn=ACTIONS[sel.dataset.action];
  if(fn)fn(sel,e,sel.value);
});

/* ---------- init ---------- */
loadDB;
window.addEventListener('hashchange',route);
route;
</script>
</body>
